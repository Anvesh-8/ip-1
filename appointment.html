<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book An Appoitment</title>
    <link rel="stylesheet" href="appointment.css">
    <link rel="shortcut icon" href="Neelimahosiptal.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Edu+VIC+WA+NT+Hand:wght@400..700&family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Oswald:wght@200..700&family=Ubuntu&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Dr xxxxxx is ready To review your care -->
    <div class="app_box">
        <img src="neelima-removebg-preview.png" alt="Neelima Hosiptal" id="neelima">
            <div class="img_below">
               <form>
                    <label>
                        <div class="names">
                            <div class="firstName">
                                <p>First Name</p>
                                <input type="text" id="firstname_in" placeholder="Enter Your First Name">
                            </div>
                            <div class="lastname">
                                <p>Last Name</p>
                                <input type="text" id="lastname" placeholder="Enter Your Last Name">
                            </div>
                        </div>
                    </label>
                    <div class="row_2">
                        <label>
                            <div class="email">
                                <p>E-mail</p>
                                <input type="email" placeholder="Ener Your E-mail Address" id="email_in">
                            </div>
                        </label>
                        <label>
                            <div class="date">
                                <p>Date of Appointment</p>
                                <input type="datetime-local" id="d">
                            </div>
                        </label>
                    </div>
                    <div class="row_3">
                        <div class="issue">
                            <label>
                                <p>Issue</p>
                                <select id="issues">
                                    <option>Don't Know the Problem</option>
                                    <option>Normal Checkup</option>
                                    <option>Heart & Blood Pressure</option>
                                    <option>Lungs & Breathing</option>
                                    <option>Brain & Nerves</option>
                                    <option>Childern's Health</option>
                                    <option>Skin,Hair & Nails</option>
                                    <option>Stomach & Digestion</option>
                                    <option>Eye Care</option>
                                    <option>ENT</option>
                                    <option>Urinary & Kidney Care</option>
                                    <option>Diabetis & Hormones</option>
                                    <option>Mental Health</option>
                                    <option>Cancer Care</option>
                                </select>
                            </label>
                        </div>
                       <div class="preference">
                            <label>
                                <p>Preference</p>
                                <select id="docs">
                                    <option>No Preference</option>
                                    <option>Dr Raghu</option>
                                    <option>Dr G Harsha Vardhan</option>
                                    <option>Dr Palla Rajeshawar Reddy</option>
                                    <option>Dr Vijay Kumar</option>
                                    <option>Dr Niteesha Sharma</option>
                                    <option>Dr Asha Latha</option>
                                    <option>Dr Damodar</option>
                                    <option>Dr Attrava</option>
                                    <option>Dr Sarojini</option>
                                    <option>Dr Nivetha</option>
                                    <option>Dr Anika Desumkh</option>
                                    <option>Dr Karthik Roy</option>
                                    <option>Dr Siddharth Sahoo</option>
                               </select>
                            </label>
                        </div>
                    </div>
                    <div class="exp_issue">
                        <label>
                            <p id="e_issue">Can You Explain Your Issue (Optional)</p> 
                            <!-- <i class="fa-solid fa-circle-info" id="info"></i> -->
                            <textarea id="textbox"></textarea>
                        </label>
                     </div>
                    <div class="row_5">
                        <div class="checkbox">
                            <input type="checkbox" id="opinon" name="seond">
                            <label for="opinon" class="so">Second Opinon</label>
                        </div>
                        <button id="upload"><i class="fa-solid fa-plus" id="plus"></i>Click Here To Upload Previous Diagonsis
                    </div>
                </form>
            </div>
    </div>
</body>
</html>
